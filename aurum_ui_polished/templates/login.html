<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurum — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Syne:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ink:      #07090f;
  --ink-2:    #0d1020;
  --ink-3:    #141828;
  --gold:     #c8a96e;
  --gold-2:   #e8cc94;
  --gold-3:   #f5e4bb;
  --gold-dim: rgba(200,169,110,0.15);
  --gold-glow:rgba(200,169,110,0.08);
  --slate:    #8b96ab;
  --slate-2:  #b0baca;
  --ice:      #dce8f5;
  --green:    #4ade9e;
  --red:      #f46a6a;
  --border:   rgba(255,255,255,0.07);
  --border-gold:rgba(200,169,110,0.25);
  --surface:  rgba(255,255,255,0.03);
  --surface-2:rgba(255,255,255,0.06);
  --ff-display:'Cormorant Garamond', Georgia, serif;
  --ff-ui:     'Syne', sans-serif;
  --ff-mono:   'JetBrains Mono', monospace;
  --ease-expo: cubic-bezier(0.16,1,0.3,1);
  --ease-back: cubic-bezier(0.34,1.56,0.64,1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  font-family: var(--ff-ui);
  background: var(--ink);
  color: var(--ice);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* Background */
#bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.5; }
.noise {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  opacity: 0.4;
}

.auth-shell {
  position: relative; z-index: 2;
  width: 100%; max-width: 460px;
  padding: 24px;
  animation: fadeUp 0.8s var(--ease-expo) both;
}

/* Logo */
.auth-logo {
  text-align: center;
  margin-bottom: 40px;
}
.auth-logo-icon {
  width: 56px; height: 56px;
  border: 1px solid var(--border-gold);
  border-radius: 14px;
  display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--ff-display); font-size: 28px; color: var(--gold);
  font-style: italic; font-weight: 600;
  margin-bottom: 14px;
  background: var(--gold-glow);
}
.auth-logo-name {
  font-family: var(--ff-display); font-size: 28px; font-weight: 600;
  letter-spacing: 0.5px; color: var(--ice);
  display: block;
}
.auth-logo-name span { color: var(--gold); }
.auth-logo-tagline {
  font-family: var(--ff-mono); font-size: 10px; letter-spacing: 2px;
  text-transform: uppercase; color: var(--slate); margin-top: 4px; display: block;
}

/* Card */
.auth-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 40px;
  position: relative;
  overflow: hidden;
}
.auth-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent 10%, var(--gold-dim) 50%, transparent 90%);
}

/* Tabs */
.auth-tabs {
  display: flex; gap: 4px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 4px;
  margin-bottom: 32px;
}
.auth-tab {
  flex: 1; padding: 10px;
  background: transparent; border: none;
  border-radius: 9px;
  font-family: var(--ff-ui); font-size: 13px; font-weight: 600;
  letter-spacing: 0.5px; color: var(--slate);
  cursor: pointer; transition: all 0.25s var(--ease-expo);
}
.auth-tab.active {
  background: var(--gold-dim);
  color: var(--gold-2);
  border: 1px solid var(--border-gold);
}

/* Form */
.form-group { margin-bottom: 18px; }
.form-label {
  font-family: var(--ff-mono); font-size: 10px; letter-spacing: 2px;
  text-transform: uppercase; color: var(--slate); margin-bottom: 8px; display: block;
}
.form-input-wrap { position: relative; }
.form-icon {
  position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
  font-size: 15px; pointer-events: none;
}
.form-input {
  width: 100%; padding: 14px 16px 14px 46px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 12px; color: var(--ice);
  font-family: var(--ff-ui); font-size: 15px;
  outline: none; transition: all 0.25s;
}
.form-input:focus {
  border-color: var(--gold); background: var(--gold-glow);
  box-shadow: 0 0 0 4px rgba(200,169,110,0.08);
}
.form-input::placeholder { color: rgba(139,150,171,0.5); }

/* Submit btn */
.auth-btn {
  width: 100%; padding: 16px;
  background: linear-gradient(135deg, #8a6c1e 0%, var(--gold) 50%, var(--gold-2) 100%);
  background-size: 200% 200%; background-position: left;
  color: var(--ink); border: none; border-radius: 12px;
  font-family: var(--ff-ui); font-size: 13px; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase; cursor: pointer;
  transition: all 0.4s var(--ease-expo);
  position: relative; overflow: hidden;
  margin-top: 8px;
}
.auth-btn:hover {
  background-position: right;
  transform: translateY(-2px);
  box-shadow: 0 12px 32px rgba(200,169,110,0.3);
}
.auth-btn:disabled { opacity: 0.6; pointer-events: none; }
.auth-btn.loading::after {
  content: ''; position: absolute; right: 20px; top: 50%;
  transform: translateY(-50%);
  width: 16px; height: 16px; border-radius: 50%;
  border: 2px solid rgba(0,0,0,0.3); border-top-color: var(--ink);
  animation: spin 0.7s linear infinite;
}

/* Error / success */
.auth-msg {
  padding: 12px 16px;
  border-radius: 10px;
  font-size: 13px;
  margin-top: 14px;
  display: none;
}
.auth-msg.error   { background: rgba(244,106,106,0.12); border: 1px solid rgba(244,106,106,0.3); color: #f46a6a; }
.auth-msg.success { background: rgba(74,222,158,0.12);  border: 1px solid rgba(74,222,158,0.3);  color: var(--green); }
.auth-msg.show { display: block; }

/* Guest link */
.auth-guest {
  text-align: center; margin-top: 20px;
  font-size: 13px; color: var(--slate);
}
.auth-guest a {
  color: var(--gold-2); text-decoration: none; border-bottom: 1px solid transparent;
  transition: border-color 0.2s;
}
.auth-guest a:hover { border-color: var(--gold-2); }

/* Divider */
.auth-divider {
  display: flex; align-items: center; gap: 16px;
  margin: 24px 0;
}
.auth-divider span { font-size: 11px; color: var(--slate); white-space: nowrap; font-family: var(--ff-mono); }
.auth-divider::before, .auth-divider::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}

/* Benefits list */
.auth-benefits {
  display: flex; flex-direction: column; gap: 10px;
  margin-bottom: 28px;
}
.benefit-item {
  display: flex; align-items: center; gap: 12px;
  font-size: 13px; color: var(--slate-2);
}
.benefit-icon { font-size: 16px; flex-shrink: 0; }

/* Animations */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes spin { to { transform: translateY(-50%) rotate(360deg); } }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.4} }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div class="noise"></div>

<div class="auth-shell">
  <!-- Logo -->
  <div class="auth-logo">
    <div class="auth-logo-icon">A</div>
    <span class="auth-logo-name">Au<span>rum</span></span>
    <span class="auth-logo-tagline">Smart Investment Guide · AI Powered</span>
  </div>

  <!-- Card -->
  <div class="auth-card">

    <!-- Benefits (shown on sign-up tab) -->
    <div class="auth-benefits" id="benefits-list">
      <div class="benefit-item"><span class="benefit-icon">🤖</span> Personalised AI advice from Gemini</div>
      <div class="benefit-item"><span class="benefit-icon">💾</span> Save your financial profile & history</div>
      <div class="benefit-item"><span class="benefit-icon">📊</span> Track goals across sessions</div>
      <div class="benefit-item"><span class="benefit-icon">🔒</span> Secure & private — your data stays yours</div>
    </div>

    <!-- Tabs -->
    <div class="auth-tabs">
      <button class="auth-tab" id="tab-login" onclick="switchTab('login')">Sign In</button>
      <button class="auth-tab active" id="tab-register" onclick="switchTab('register')">Create Account</button>
    </div>

    <!-- Register Form -->
    <div id="form-register">
      <div class="form-group">
        <label class="form-label">Your name</label>
        <div class="form-input-wrap">
          <span class="form-icon">👤</span>
          <input type="text" class="form-input" id="reg-name" placeholder="e.g. Arjun Sharma" autocomplete="name">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Email address</label>
        <div class="form-input-wrap">
          <span class="form-icon">📧</span>
          <input type="email" class="form-input" id="reg-email" placeholder="you@example.com" autocomplete="email">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="form-input-wrap">
          <span class="form-icon">🔑</span>
          <input type="password" class="form-input" id="reg-password" placeholder="Min. 6 characters" autocomplete="new-password">
        </div>
      </div>
      <button class="auth-btn" id="reg-btn" onclick="doRegister()">Create My Account →</button>
      <div class="auth-msg" id="reg-msg"></div>
    </div>

    <!-- Login Form -->
    <div id="form-login" style="display:none">
      <div class="form-group">
        <label class="form-label">Email address</label>
        <div class="form-input-wrap">
          <span class="form-icon">📧</span>
          <input type="email" class="form-input" id="login-email" placeholder="you@example.com" autocomplete="email">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="form-input-wrap">
          <span class="form-icon">🔑</span>
          <input type="password" class="form-input" id="login-password" placeholder="Your password" autocomplete="current-password">
        </div>
      </div>
      <button class="auth-btn" id="login-btn" onclick="doLogin()">Sign In →</button>
      <div class="auth-msg" id="login-msg"></div>
    </div>

    <div class="auth-divider"><span>or</span></div>

    <div class="auth-guest">
      <a href="/">Continue as guest</a> — some features will be limited
    </div>
  </div>
</div>

<script>
/* ── Background canvas ── */
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let particles = [];

function resize() {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
resize();
window.addEventListener('resize', resize);

for (let i = 0; i < 60; i++) {
  particles.push({
    x: Math.random() * innerWidth,
    y: Math.random() * innerHeight,
    r: Math.random() * 1.5 + 0.3,
    dx: (Math.random() - 0.5) * 0.3,
    dy: (Math.random() - 0.5) * 0.3,
    a: Math.random()
  });
}

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  // Radial gold glow in centre
  const grd = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 0, canvas.width/2, canvas.height/2, canvas.width*0.6);
  grd.addColorStop(0, 'rgba(200,169,110,0.04)');
  grd.addColorStop(1, 'transparent');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  particles.forEach(p => {
    p.x += p.dx; p.y += p.dy;
    if (p.x < 0) p.x = canvas.width;
    if (p.x > canvas.width) p.x = 0;
    if (p.y < 0) p.y = canvas.height;
    if (p.y > canvas.height) p.y = 0;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(200,169,110,${p.a * 0.4})`;
    ctx.fill();
  });
  requestAnimationFrame(animate);
}
animate();

/* ── Tab switching ── */
function switchTab(tab) {
  const isLogin = tab === 'login';
  document.getElementById('tab-login').classList.toggle('active', isLogin);
  document.getElementById('tab-register').classList.toggle('active', !isLogin);
  document.getElementById('form-login').style.display    = isLogin ? '' : 'none';
  document.getElementById('form-register').style.display = isLogin ? 'none' : '';
  document.getElementById('benefits-list').style.display = isLogin ? 'none' : '';
}

/* ── Show message ── */
function showMsg(id, text, type) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = `auth-msg ${type} show`;
}

/* ── Register ── */
async function doRegister() {
  const name     = document.getElementById('reg-name').value.trim();
  const email    = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-password').value;
  const btn      = document.getElementById('reg-btn');

  if (!name || !email || !password) {
    showMsg('reg-msg', 'Please fill in all fields.', 'error');
    return;
  }

  btn.disabled = true;
  btn.classList.add('loading');
  btn.textContent = 'Creating account...';

  try {
    const res  = await fetch('/api/auth/register', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({name, email, password})
    });
    const data = await res.json();
    if (!res.ok) {
      showMsg('reg-msg', data.error || 'Registration failed.', 'error');
      btn.disabled = false; btn.classList.remove('loading'); btn.textContent = 'Create My Account →';
    } else {
      showMsg('reg-msg', `Welcome, ${data.name}! Redirecting...`, 'success');
      setTimeout(() => window.location.href = '/', 1000);
    }
  } catch {
    showMsg('reg-msg', 'Network error. Please try again.', 'error');
    btn.disabled = false; btn.classList.remove('loading'); btn.textContent = 'Create My Account →';
  }
}

/* ── Login ── */
async function doLogin() {
  const email    = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const btn      = document.getElementById('login-btn');

  if (!email || !password) {
    showMsg('login-msg', 'Please enter email and password.', 'error');
    return;
  }

  btn.disabled = true;
  btn.classList.add('loading');
  btn.textContent = 'Signing in...';

  try {
    const res  = await fetch('/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({email, password})
    });
    const data = await res.json();
    if (!res.ok) {
      showMsg('login-msg', data.error || 'Login failed.', 'error');
      btn.disabled = false; btn.classList.remove('loading'); btn.textContent = 'Sign In →';
    } else {
      showMsg('login-msg', `Welcome back, ${data.name}!`, 'success');
      setTimeout(() => window.location.href = '/', 800);
    }
  } catch {
    showMsg('login-msg', 'Network error. Please try again.', 'error');
    btn.disabled = false; btn.classList.remove('loading'); btn.textContent = 'Sign In →';
  }
}

/* ── Enter key support ── */
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const loginVisible = document.getElementById('form-login').style.display !== 'none';
  if (loginVisible) doLogin();
  else doRegister();
});
</script>
</body>
</html>
